<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Personal - EZ Personal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0d1b26;
        --card: #132635;
        --text: #e2ebf3;
        --muted: #9fb1bf;
        --brand-primary: #73d537;
        --brand-secondary: #024d3a;
        --accent: #73d537;
        --accent-2: #024d3a;
        --focus: #73d537;
        --danger: #b91c1c;
        --danger-bg: #fee2e2;
        --ok: #024d3a;
        --ok-bg: rgba(115, 213, 55, 0.18);
        --border: #355062;
        --card-border: #2a4354;
        --card-shadow: 0 10px 30px rgba(2, 7, 14, 0.5);
      }

      body.embed-light {
        --bg: #f4f5f8;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #64748b;
        --border: #d1d5db;
        --card-border: #e5e7eb;
        --card-shadow: 0 8px 24px rgba(16, 24, 40, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      body.embed-compact {
        min-height: auto;
      }

      .wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      body.embed-compact .wrapper {
        min-height: auto;
        align-items: flex-start;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }

      body.embed-light label {
        color: #334155;
      }

      body.embed-light input {
        background: #ffffff;
        color: #1f2937;
      }

      body.embed-light .password-list {
        background: #f8fafc;
        border: 1px solid #dbe3ea;
      }

      body.embed-light .btn-secondary {
        background: #f8fafc;
        color: #334155;
        border: 1px solid #d1d5db;
      }

      body.embed-light .btn-secondary:hover {
        background: #eef2f7;
      }

      .card-header {
        background: linear-gradient(
          135deg,
          var(--brand-primary) 0%,
          var(--brand-secondary) 100%
        );
        color: #ffffff;
        padding: 20px 24px;
      }

      .card-body {
        padding: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        line-height: 1.15;
      }

      .subtitle {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #b6c7d4;
        font-weight: 500;
        font-size: 14px;
      }

      input {
        width: 100%;
        height: 40px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.2s ease;
        background: #0f202d;
        color: #e3ecf4;
      }

      input:focus {
        outline: none;
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(115, 213, 55, 0.14);
      }

      .hint {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .password-list {
        margin: 8px 0 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 12px;
        background: #0f202d;
        border: 1px solid #2d4353;
        border-radius: 8px;
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .password-list li {
        margin-bottom: 3px;
      }

      .password-list li.ok {
        color: var(--ok);
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 18px;
      }

      .btn {
        appearance: none;
        -webkit-appearance: none;
        border: none;
        border-radius: 5px;
        height: 52px;
        min-height: 52px;
        padding: 12px 16px;
        line-height: 1.2;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #ffffff;
        width: 100%;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.3px;
      }

      .btn-primary:hover {
        filter: brightness(1.04);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #203647;
        color: #dbe6ef;
        border: 1px solid #2f495b;
        width: 100%;
      }

      .btn-secondary:hover {
        background: #29465b;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.75;
        transform: none;
      }

      .alert {
        margin-top: 12px;
        border-radius: 5px;
        padding: 12px 14px;
        font-size: 13px;
        display: none;
      }

      .alert.error {
        display: block;
        background: var(--danger-bg);
        color: var(--danger);
      }

      .alert.success {
        display: block;
        background: var(--ok-bg);
        color: var(--ok);
      }

      .footer {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
        display: none;
      }

      .footer a {
        color: var(--accent);
      }

      @media (max-width: 560px) {
        .card-header {
          padding: 18px;
        }

        .card-body {
          padding: 16px;
        }

        h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="card-header">
          <h1>Cadastre-se como Personal</h1>
        </div>

        <div class="card-body">
          <form id="signupForm">
            <div class="form-group">
              <label for="name">Nome</label>
              <input
                id="name"
                type="text"
                placeholder="Seu nome completo"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                placeholder="voce@dominio.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="whatsapp">WhatsApp</label>
              <input
                id="whatsapp"
                type="text"
                placeholder="(11) 99999-9999"
                required
              />
              <div class="hint">Use DDD. Você pode incluir +55.</div>
            </div>

            <div class="form-group">
              <label for="password">Senha</label>
              <input
                id="password"
                type="password"
                placeholder="Crie uma senha forte"
                required
              />
              <ul class="password-list" id="passwordChecklist">
                <li id="ruleLength">Mínimo de 8 caracteres</li>
                <li id="ruleUpper">Pelo menos 1 letra maiúscula</li>
                <li id="ruleLower">Pelo menos 1 letra minúscula</li>
                <li id="ruleNumber">Pelo menos 1 número</li>
                <li id="ruleSymbol">Pelo menos 1 símbolo</li>
              </ul>
            </div>

            <div class="row">
              <button type="submit" class="btn btn-primary" id="submitBtn">
                Criar conta
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                id="recoverBtn"
                title="Enviar link de recuperação de senha para o e-mail informado"
              >
                Recuperar senha
              </button>
            </div>
          </form>

          <div id="formAlert" class="alert"></div>

          <p class="footer">
            Já possui conta?
            <a href="/" target="_blank" rel="noopener">Acesse a plataforma</a>.
          </p>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const source = params.get("source") || "landing";
      const recoverRedirect = params.get("recover_redirect") || "";
      const embedTheme = params.get("embed_theme") || "";
      const embedCompact = params.get("embed_compact") === "1";
      const apiBase = window.location.origin;

      if (embedTheme === "light") {
        document.body.classList.add("embed-light");
      }

      if (embedCompact) {
        document.body.classList.add("embed-compact");
      }

      const form = document.getElementById("signupForm");
      const alertBox = document.getElementById("formAlert");
      const submitBtn = document.getElementById("submitBtn");
      const recoverBtn = document.getElementById("recoverBtn");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      function showAlert(message, type) {
        alertBox.className = "alert " + type;
        alertBox.textContent = message;
      }

      function checkPassword(password) {
        return {
          length: password.length >= 8,
          upper: /[A-Z]/.test(password),
          lower: /[a-z]/.test(password),
          number: /[0-9]/.test(password),
          symbol: /[^A-Za-z0-9]/.test(password),
        };
      }

      function updatePasswordChecklist(password) {
        const rules = checkPassword(password);

        document
          .getElementById("ruleLength")
          .classList.toggle("ok", rules.length);
        document
          .getElementById("ruleUpper")
          .classList.toggle("ok", rules.upper);
        document
          .getElementById("ruleLower")
          .classList.toggle("ok", rules.lower);
        document
          .getElementById("ruleNumber")
          .classList.toggle("ok", rules.number);
        document
          .getElementById("ruleSymbol")
          .classList.toggle("ok", rules.symbol);

        return Object.values(rules).every(Boolean);
      }

      passwordInput.addEventListener("input", () => {
        updatePasswordChecklist(passwordInput.value);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          name: document.getElementById("name").value.trim(),
          email: emailInput.value.trim().toLowerCase(),
          whatsapp: document.getElementById("whatsapp").value.trim(),
          password: passwordInput.value,
          source,
        };

        if (
          !payload.name ||
          !payload.email ||
          !payload.whatsapp ||
          !payload.password
        ) {
          showAlert("Preencha todos os campos obrigatórios.", "error");
          return;
        }

        if (!updatePasswordChecklist(payload.password)) {
          showAlert("A senha não atende aos critérios mínimos.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Criando...";

        try {
          const response = await fetch(
            apiBase + "/api/public/personals/signup",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.message || "Não foi possível concluir o cadastro.",
            );
          }

          showAlert(
            "Conta criada com sucesso! Redirecionando para a plataforma...",
            "success",
          );
          form.reset();
          updatePasswordChecklist("");

          // Redireciona para a plataforma com o e-mail pré-preenchido
          setTimeout(() => {
            const dest =
              window.location.origin +
              "/?email=" +
              encodeURIComponent(payload.email);
            if (window.top && window.top !== window) {
              window.top.location.href = dest;
            } else {
              window.location.href = dest;
            }
          }, 1800);
        } catch (error) {
          showAlert(error.message || "Erro ao cadastrar.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Criar conta";
        }
      });

      recoverBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
          showAlert(
            "Informe o e-mail para receber o link de recuperação.",
            "error",
          );
          return;
        }

        recoverBtn.disabled = true;
        recoverBtn.textContent = "Enviando...";

        try {
          const response = await fetch(
            apiBase + "/api/public/personals/password-recovery",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email,
                ...(recoverRedirect ? { redirect_to: recoverRedirect } : {}),
              }),
            },
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.message || "Não foi possível enviar o link.");
          }

          showAlert(
            "Se o e-mail existir, você receberá o link de recuperação em instantes.",
            "success",
          );
        } catch (error) {
          showAlert(
            error.message || "Erro ao solicitar recuperação de senha.",
            "error",
          );
        } finally {
          recoverBtn.disabled = false;
          recoverBtn.textContent = "Recuperar senha";
        }
      });

      updatePasswordChecklist("");
    </script>
    <script>
      window.si =
        window.si ||
        function () {
          (window.siq = window.siq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
